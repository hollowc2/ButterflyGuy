services:
  live:
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8011/ready', timeout=10).read()
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 30s
