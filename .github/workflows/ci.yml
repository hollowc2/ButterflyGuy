name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Replaces the Validate step of the retired self-hosted deploy.yml. Deploy only
  # a commit on which this job and database-smoke's timescaledb job passed.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv run pytest -q
      - run: uv run ruff check .
      - name: Render compose config
        run: |
          touch .env
          SCHWAB_GATEWAY_TOKEN_DIR=/tmp/butterflyguy-ci-token \
            docker compose -f infra/docker-compose.yml config >/dev/null
