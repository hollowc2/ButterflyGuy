name: Database Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  timescaledb:
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:2.30.1-pg16
        env:
          POSTGRES_USER: butterfly
          POSTGRES_PASSWORD: butterfly
          POSTGRES_DB: butterfly_guy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U butterfly -d butterfly_guy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv run pytest -q tests/integration/test_database_smoke.py
        env:
          CI_DATABASE_URL: postgresql://butterfly:butterfly@127.0.0.1:5432/butterfly_guy
