# SCHWAB_GATEWAY_TOKEN_DIR is the established host directory holding the shared tokens.json.
# It carries no default on purpose: a bind whose source path does not exist does not fail,
# Docker silently creates an empty directory, so an unset variable must refuse rather than
# guess. Compose reads it from this directory's .env.
networks:
  monitoring_net:
    external: true

services:
  app_spx:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_spx_app
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      # The token *directory* is mounted, not the document. Shared token writers persist
      # with os.replace, which swaps in a NEW inode; a document-level bind pins the old
      # one, so the container silently stops seeing every later write -- including a
      # re-authorized refresh token.
      - "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}"
      - ../configs/config.yaml:/app/configs/config.yaml
      - ../data/chains:/app/data/chains
    environment:
      # Set from the same required variable as the bind above so the two cannot
      # disagree, and never inherited from ../.env.
      SCHWAB_TOKEN_PATH: "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}/tokens.json"
      DATABASE__HOST: timescaledb
      DATABASE__PORT: 5432
      DATABASE__NAME: butterfly_guy
      DATABASE__USER: butterfly
      ALERTMANAGER_URL: http://alertmanager:9093
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:8000:8000"  # Prometheus metrics

  app_spx_candidate:
    profiles: [spx-candidate]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_spx_candidate
    # Legacy BEST_RR rollback service; keep it stopped unless explicitly started.
    restart: "no"
    command: ["python", "-m", "butterfly_guy.scripts.run_live", "--config", "configs/config_spx_candidate.yaml"]
    env_file:
      - ../.env
    volumes:
      # Directory bind, read-only: see the note on app_spx. This service only reads.
      - "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:ro"
      - ../configs/config_spx_candidate.yaml:/app/configs/config_spx_candidate.yaml:ro
    environment:
      # Set from the same required variable as the bind above so the two cannot
      # disagree, and never inherited from ../.env.
      SCHWAB_TOKEN_PATH: "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}/tokens.json"
      DATABASE__HOST: timescaledb
      DATABASE__PORT: 5432
      DATABASE__NAME: butterfly_guy_spx_candidate
      DATABASE__USER: butterfly
      EXECUTION__PAPER_TRADING: "true"
      EXECUTION__ALLOW_LIVE_TRADING: "false"
      ALLOW_LIVE_TRADING: "false"
      DISCORD_WEBHOOK_URL: ""
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_CHAT_ID: ""
      ALERTMANAGER_URL: ""
    read_only: true
    tmpfs:
      - /tmp
      - /app/data/chains
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:8005:8000"

  app_ndx:
    profiles: [ndx]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_ndx_app
    restart: unless-stopped
    command: ["python", "-m", "butterfly_guy.scripts.run_live", "--config", "configs/config_ndx.yaml"]
    env_file:
      - ../.env
    volumes:
      # Directory bind, not the document: see the note on app_spx.
      - "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}"
      - ../configs/config_ndx.yaml:/app/configs/config_ndx.yaml
      - ../data/chains:/app/data/chains
    environment:
      # Set from the same required variable as the bind above so the two cannot
      # disagree, and never inherited from ../.env.
      SCHWAB_TOKEN_PATH: "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}/tokens.json"
      DATABASE__HOST: timescaledb
      DATABASE__PORT: 5432
      DATABASE__NAME: butterfly_guy
      DATABASE__USER: butterfly
      ALERTMANAGER_URL: http://alertmanager:9093
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:8001:8000"  # host:8001 → container:8000

  app_xsp:
    profiles: [xsp]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_xsp_app
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - export LIVE_EXPECTED_SCHWAB_ACCOUNT_ID="$${SCHWAB_ACCOUNT_ID}"; exec python -m butterfly_guy.scripts.run_live --config configs/config_xsp.yaml
    env_file:
      - ../.env
    volumes:
      # Directory bind, not the document: see the note on app_spx.
      - "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}"
      - ../configs/config_xsp.yaml:/app/configs/config_xsp.yaml
      - ../data/chains:/app/data/chains
    environment:
      # Set from the same required variable as the bind above so the two cannot
      # disagree, and never inherited from ../.env.
      SCHWAB_TOKEN_PATH: "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}/tokens.json"
      DATABASE__HOST: timescaledb
      DATABASE__PORT: 5432
      DATABASE__NAME: butterfly_guy
      DATABASE__USER: butterfly
      ALERTMANAGER_URL: http://alertmanager:9093
      LIVE_ACCOUNT_ALLOCATION: "20000"
      LIVE_MAX_ACCOUNT_DAILY_LOSS: "50"
      LIVE_XSP_CANARY: "false"
      # C3 is an XSP-only canary. The URL, key, and canary flag are Compose
      # interpolation values from infra/.env; they are not inherited by SPX/NDX.
      # Direct remains authoritative even when the shadow flag is enabled.
      SCHWAB_ACCESS_MODE: "direct"
      SCHWAB_GATEWAY_URL: "${SCHWAB_GATEWAY_URL:-http://schwab-gateway:8011}"
      SCHWAB_GATEWAY_API_KEY: "${SCHWAB_GATEWAY_API_KEY:-}"
      SCHWAB_GATEWAY_SHADOW_READS: "${SCHWAB_GATEWAY_SHADOW_READS_XSP:-false}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - monitoring_net
    ports:
      - "127.0.0.1:8003:8000"  # host:8003 → container:8000
