name: butterfly_gateway_foundation

services:
  schwab_gateway_foundation:
    profiles: [gateway-foundation]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_schwab_gateway_foundation
    restart: "no"
    user: "${SCHWAB_GATEWAY_UID:-1001}:${SCHWAB_GATEWAY_GID:-1001}"
    command: ["python", "-m", "butterfly_guy.scripts.run_schwab_gateway", "--demo"]
    environment:
      SCHWAB_GATEWAY_BIND_HOST: 0.0.0.0
      SCHWAB_GATEWAY_PORT: 8010
      SCHWAB_GATEWAY_INTERNAL_KEYS_PATH: /run/secrets/schwab-gateway-keys.json
      SCHWAB_GATEWAY_ORDER_WRITES_ENABLED: "false"
    volumes:
      - ../secrets/schwab-gateway-keys.json:/run/secrets/schwab-gateway-keys.json:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "127.0.0.1:8010:8010"
