name: butterfly_gateway_foundation

services:
  schwab_gateway_foundation:
    profiles: [gateway-foundation]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_schwab_gateway_foundation
    restart: "no"
    user: "${SCHWAB_GATEWAY_UID:-1001}:${SCHWAB_GATEWAY_GID:-1001}"
    command: ["python", "-m", "butterfly_guy.scripts.run_schwab_gateway", "--demo"]
    environment:
      SCHWAB_GATEWAY_BIND_HOST: 0.0.0.0
      SCHWAB_GATEWAY_PORT: 8010
      SCHWAB_GATEWAY_INTERNAL_KEYS_PATH: /run/secrets/schwab-gateway-keys.json
      SCHWAB_GATEWAY_ORDER_WRITES_ENABLED: "false"
    volumes:
      - ../secrets/schwab-gateway-keys.json:/run/secrets/schwab-gateway-keys.json:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    ports:
      - "127.0.0.1:8010:8010"

  # Option A: the same image serving real Schwab reads through the locked token manager.
  # Kept as a separate service under its own non-default profile so it can never be
  # started by the same command as the demo service. Neither profile is default, so
  # `docker compose up` without an explicit -f and --profile starts nothing here.
  schwab_gateway_live:
    profiles: [gateway-live]
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: butterfly_schwab_gateway_live
    restart: "no"
    user: "${SCHWAB_GATEWAY_UID:-1001}:${SCHWAB_GATEWAY_GID:-1001}"
    command:
      - python
      - -m
      - butterfly_guy.scripts.run_schwab_gateway
      - --serve-live
      - --authorize-real-credential-read
      - --confirm-single-token-writer
    # SCHWAB_API_KEY and SCHWAB_SECRET_KEY are inherited from the environment file and
    # are never named on the command line.
    env_file:
      - ../.env
    environment:
      SCHWAB_GATEWAY_BIND_HOST: 0.0.0.0
      SCHWAB_GATEWAY_PORT: 8011
      SCHWAB_GATEWAY_INTERNAL_KEYS_PATH: /run/secrets/schwab-gateway-keys.json
      SCHWAB_GATEWAY_ORDER_WRITES_ENABLED: "false"
      # The token document must be reachable at the same absolute path inside the
      # container as the directory bind below provides.
      SCHWAB_TOKEN_PATH: "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}/tokens.json"
    volumes:
      - ../secrets/schwab-gateway-keys.json:/run/secrets/schwab-gateway-keys.json:ro
      # The token *directory* is mounted writable, not the document. AtomicTokenManager
      # creates its advisory lock and its atomic replacement as siblings of the token
      # file, and os.replace cannot cross filesystems, so a document-only bind mount
      # under read_only: true cannot work -- that is exactly what stopped the
      # in-container credential proof (CODEX_STATE.md:221-224).
      - "${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:${SCHWAB_GATEWAY_TOKEN_DIR:?set the host token directory}:rw"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8011/ready', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "127.0.0.1:8011:8011"
